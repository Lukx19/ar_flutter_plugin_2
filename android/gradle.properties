android.useAndroidX=true
android.enableJetifier=true
# Standalone native checks compile Kotlin in the Gradle process. Its default
# 512 MiB heap thrashed during incremental mapper compilation on JDK 17.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Flutter and bundled plugins still use the legacy Android DSL and explicit KGP.
# Retain the documented AGP 9 compatibility mode until the Flutter migration.
android.builtInKotlin=false
android.newDsl=false
