group 'com.uhg0.ar_flutter_plugin_2'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.4.0'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk 36
    namespace 'com.uhg0.ar_flutter_plugin_2'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        test.resources.srcDirs += '../test/fixtures'
        test.resources.srcDirs += '../../../docs/m0'
    }

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        compose true
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'io.github.sceneview:arsceneview:4.21.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// The Flutter Gradle plugin injects this dependency when the plugin is built
// through a Flutter application. Keep the standalone JVM project equivalent
// for deterministic native adapter tests without bundling Flutter into the
// plugin artifact itself.
def flutterSdk = providers.gradleProperty('flutter.sdk').orNull ?: System.getenv('FLUTTER_ROOT')
if (flutterSdk != null) {
    def engineVersion = file("$flutterSdk/bin/cache/engine.stamp").text.trim()
    repositories {
        maven { url = uri('https://storage.googleapis.com/download.flutter.io') }
    }
    dependencies {
        debugCompileOnly "io.flutter:flutter_embedding_debug:1.0.0-$engineVersion"
        testImplementation "io.flutter:flutter_embedding_debug:1.0.0-$engineVersion"
    }
}
