group 'com.uhg0.ar_flutter_plugin_2'
version '1.0-SNAPSHOT'

// Flutter forwards --dart-define values to every Android subproject through
// the comma-separated, base64-encoded dart-defines project property. Keep the
// explicit Gradle property as the standalone/native-test override, then use
// the define as the APK-build fallback so matched Flutter builds do not depend
// on daemon process environment inheritance.
def coverageSelectionReuseProperty = project.findProperty('coverageSelectionReuse')?.toString()
def coveragePublicationDiagnosticsProperty = project.findProperty('coveragePublicationDiagnostics')?.toString()
def encodedDartDefines = project.findProperty('dart-defines')?.toString()
def coverageDefinePrefix = 'CAPTURE3D_COVERAGE_SELECTION_REUSE='
def publicationDiagnosticsDefinePrefix = 'CAPTURE3D_PUBLICATION_DIAGNOSTICS='
def coverageDefineValues = encodedDartDefines?.split(',')?.collect { encoded ->
        try {
            new String(
                java.util.Base64.decoder.decode(encoded),
                java.nio.charset.StandardCharsets.UTF_8,
            )
        } catch (Exception ignored) {
            null
        }
    }?.findAll { value -> value?.startsWith(coverageDefinePrefix) }
def publicationDiagnosticsDefineValues = encodedDartDefines?.split(',')?.collect { encoded ->
        try {
            new String(
                java.util.Base64.decoder.decode(encoded),
                java.nio.charset.StandardCharsets.UTF_8,
            )
        } catch (Exception ignored) {
            null
        }
    }?.findAll { value -> value?.startsWith(publicationDiagnosticsDefinePrefix) }
if (coverageDefineValues != null && coverageDefineValues.size() > 1) {
    throw new GradleException(
        "Duplicate $coverageDefinePrefix dart-defines are not allowed",
    )
}
if (coverageSelectionReuseProperty == null && coverageDefineValues?.size() == 1) {
    coverageSelectionReuseProperty = coverageDefineValues[0].substring(coverageDefinePrefix.length())
}
if (publicationDiagnosticsDefineValues != null && publicationDiagnosticsDefineValues.size() > 1) {
    throw new GradleException(
        "Duplicate $publicationDiagnosticsDefinePrefix dart-defines are not allowed",
    )
}
if (coveragePublicationDiagnosticsProperty == null && publicationDiagnosticsDefineValues?.size() == 1) {
    coveragePublicationDiagnosticsProperty = publicationDiagnosticsDefineValues[0].substring(publicationDiagnosticsDefinePrefix.length())
}
def normalizedCoverageSelectionReuse = coverageSelectionReuseProperty?.trim()
if (normalizedCoverageSelectionReuse != null &&
    !['true', 'false'].any { value -> value.equalsIgnoreCase(normalizedCoverageSelectionReuse) }) {
    throw new GradleException(
        "$coverageDefinePrefix must be true or false, got '$coverageSelectionReuseProperty'",
    )
}
def coverageSelectionReuse = normalizedCoverageSelectionReuse?.equalsIgnoreCase('true') ?: false
def normalizedCoveragePublicationDiagnostics = coveragePublicationDiagnosticsProperty?.trim()
if (normalizedCoveragePublicationDiagnostics != null &&
    !['true', 'false'].any { value -> value.equalsIgnoreCase(normalizedCoveragePublicationDiagnostics) }) {
    throw new GradleException(
        "$publicationDiagnosticsDefinePrefix must be true or false, got '$coveragePublicationDiagnosticsProperty'",
    )
}
def coveragePublicationDiagnostics = normalizedCoveragePublicationDiagnostics?.equalsIgnoreCase('true') ?: false

def canonicalReadyWakeProperty = project.findProperty('coverageCanonicalReadyWake')?.toString()
def canonicalReadyWakePrefix = 'CAPTURE3D_CANONICAL_READY_WAKE='
def canonicalReadyWakeValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { value -> value?.startsWith(canonicalReadyWakePrefix) }
if (canonicalReadyWakeValues != null && canonicalReadyWakeValues.size() > 1) {
    throw new GradleException("Duplicate $canonicalReadyWakePrefix dart-defines are not allowed")
}
if (canonicalReadyWakeProperty == null && canonicalReadyWakeValues?.size() == 1) {
    canonicalReadyWakeProperty = canonicalReadyWakeValues[0].substring(canonicalReadyWakePrefix.length())
}
def normalizedCanonicalReadyWake = canonicalReadyWakeProperty?.trim()
if (normalizedCanonicalReadyWake != null &&
    !['true', 'false'].any { value -> value.equalsIgnoreCase(normalizedCanonicalReadyWake) }) {
    throw new GradleException("$canonicalReadyWakePrefix must be true or false, got '$canonicalReadyWakeProperty'")
}
def coverageCanonicalReadyWake = normalizedCanonicalReadyWake?.equalsIgnoreCase('true') ?: false

def frameAttributionPrefix = 'CAPTURE3D_NATIVE_FRAME_ATTRIBUTION='
def frameAttributionProperty = project.findProperty('nativeFrameAttribution')?.toString()
def frameAttributionValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { value -> value?.startsWith(frameAttributionPrefix) }
if (frameAttributionValues != null && frameAttributionValues.size() > 1) {
    throw new GradleException("Duplicate $frameAttributionPrefix dart-defines are not allowed")
}
if (frameAttributionProperty == null && frameAttributionValues?.size() == 1) {
    frameAttributionProperty = frameAttributionValues[0].substring(frameAttributionPrefix.length())
}
if (frameAttributionProperty != null &&
    !['true', 'false'].any { it.equalsIgnoreCase(frameAttributionProperty.trim()) }) {
    throw new GradleException("$frameAttributionPrefix must be true or false")
}
def nativeFrameAttribution = frameAttributionProperty?.trim()?.equalsIgnoreCase('true') ?: false

def stillPreviewFpsPrefix = 'CAPTURE3D_MATCH_STILL_PREVIEW_FPS='
def stillPreviewFpsProperty = project.findProperty('matchStillPreviewFps')?.toString()
def stillPreviewFpsValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { value -> value?.startsWith(stillPreviewFpsPrefix) }
if (stillPreviewFpsValues != null && stillPreviewFpsValues.size() > 1) {
    throw new GradleException("Duplicate $stillPreviewFpsPrefix dart-defines are not allowed")
}
if (stillPreviewFpsProperty == null && stillPreviewFpsValues?.size() == 1) {
    stillPreviewFpsProperty = stillPreviewFpsValues[0].substring(stillPreviewFpsPrefix.length())
}
if (stillPreviewFpsProperty != null &&
    !['true', 'false'].any { it.equalsIgnoreCase(stillPreviewFpsProperty.trim()) }) {
    throw new GradleException("$stillPreviewFpsPrefix must be true or false")
}
def matchStillPreviewFps = stillPreviewFpsProperty?.trim()?.equalsIgnoreCase('true') ?: false

def videoSnapshotPrefix = 'CAPTURE3D_VIDEO_SNAPSHOT_JPEG='
def videoSnapshotProperty = project.findProperty('videoSnapshotJpeg')?.toString()
def videoSnapshotValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { value -> value?.startsWith(videoSnapshotPrefix) }
if (videoSnapshotValues != null && videoSnapshotValues.size() > 1) {
    throw new GradleException("Duplicate $videoSnapshotPrefix dart-defines are not allowed")
}
if (videoSnapshotProperty == null && videoSnapshotValues?.size() == 1) {
    videoSnapshotProperty = videoSnapshotValues[0].substring(videoSnapshotPrefix.length())
}
if (videoSnapshotProperty != null &&
    !['true', 'false'].any { it.equalsIgnoreCase(videoSnapshotProperty.trim()) }) {
    throw new GradleException("$videoSnapshotPrefix must be true or false")
}
def videoSnapshotJpeg = videoSnapshotProperty?.trim()?.equalsIgnoreCase('true') ?: false
if (matchStillPreviewFps && videoSnapshotJpeg) {
    throw new GradleException('Still FPS match and video snapshot JPEG experiments are mutually exclusive')
}

buildscript {
    ext.kotlin_version = '2.4.20'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Experimental source is build-latched; it never changes ARCore session capability or JPEG capture.
def rawDepthCandidateProperty = project.findProperty('rawDepthCandidate')?.toString()
def rawDepthCandidatePrefix = 'CAPTURE3D_RAW_DEPTH_CANDIDATE='
def rawDepthCandidateValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { it?.startsWith(rawDepthCandidatePrefix) }
if (rawDepthCandidateValues?.size() > 1) throw new GradleException('Duplicate RAW depth candidate define')
if (rawDepthCandidateProperty == null && rawDepthCandidateValues?.size() == 1) {
    rawDepthCandidateProperty = rawDepthCandidateValues[0].substring(rawDepthCandidatePrefix.length())
}
def normalizedRawDepthCandidate = rawDepthCandidateProperty?.trim() ?: 'false'
if (!['true', 'false'].any { it.equalsIgnoreCase(normalizedRawDepthCandidate) }) {
    throw new GradleException('rawDepthCandidate must be true or false')
}
def rawDepthCandidate = normalizedRawDepthCandidate.toBoolean()

// Unqualified current-frame Dense association experiment; native DEBUG builds only.
def denseCurrentFrameExperimentProperty = project.findProperty('denseCurrentFrameExperiment')?.toString()
def denseCurrentFrameExperimentPrefix = 'CAPTURE3D_DENSE_CURRENT_FRAME_EXPERIMENT='
def denseCurrentFrameExperimentValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { it?.startsWith(denseCurrentFrameExperimentPrefix) }
if (denseCurrentFrameExperimentValues?.size() > 1) throw new GradleException('Duplicate Dense current-frame experiment define')
if (denseCurrentFrameExperimentProperty == null && denseCurrentFrameExperimentValues?.size() == 1) {
    denseCurrentFrameExperimentProperty = denseCurrentFrameExperimentValues[0].substring(denseCurrentFrameExperimentPrefix.length())
}
def normalizedDenseCurrentFrameExperiment = denseCurrentFrameExperimentProperty == null ? 'false' : denseCurrentFrameExperimentProperty.trim()
if (!['true', 'false'].any { it.equalsIgnoreCase(normalizedDenseCurrentFrameExperiment) }) {
    throw new GradleException('denseCurrentFrameExperiment must be true or false')
}
def denseCurrentFrameExperiment = normalizedDenseCurrentFrameExperiment.toBoolean()

// Marker detector (visibility grid markers): the native library (shared C
// library with its AprilTag backend, native/marker_detector) is built only
// with CAPTURE3D_GRID_MARKERS=true (or -PgridMarkers=true for standalone
// plugin builds), so the default APK does not grow.
def gridMarkersProperty = project.findProperty('gridMarkers')?.toString()
def gridMarkersPrefix = 'CAPTURE3D_GRID_MARKERS='
def gridMarkersValues = encodedDartDefines?.split(',')?.collect { encoded ->
    try { new String(java.util.Base64.decoder.decode(encoded), java.nio.charset.StandardCharsets.UTF_8) }
    catch (Exception ignored) { null }
}?.findAll { it?.startsWith(gridMarkersPrefix) }
if (gridMarkersValues?.size() > 1) throw new GradleException('Duplicate CAPTURE3D_GRID_MARKERS define')
if (gridMarkersProperty == null && gridMarkersValues?.size() == 1) {
    gridMarkersProperty = gridMarkersValues[0].substring(gridMarkersPrefix.length())
}
def gridMarkers = (gridMarkersProperty ?: 'false').trim().equalsIgnoreCase('true')

android {
    compileSdk 37
    ndkVersion "28.2.13676358" // Match the host app native toolchain.
    namespace 'com.uhg0.ar_flutter_plugin_2'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        test.resources.srcDirs += '../../../docs/proposal08/evidence'
    }

    defaultConfig {
        buildConfigField('boolean', 'NATIVE_FRAME_ATTRIBUTION', nativeFrameAttribution.toString())
        buildConfigField('boolean', 'RAW_DEPTH_CANDIDATE', rawDepthCandidate.toString())
        buildConfigField('boolean', 'DENSE_CURRENT_FRAME_EXPERIMENT', denseCurrentFrameExperiment.toString())
        buildConfigField('boolean', 'MATCH_STILL_PREVIEW_FPS', matchStillPreviewFps.toString())
        buildConfigField('boolean', 'VIDEO_SNAPSHOT_JPEG', videoSnapshotJpeg.toString())
        minSdkVersion 28
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                if (gridMarkers) {
                    arguments '-DCAPTURE3D_GRID_MARKERS=ON'
                }
            }
        }
    }

    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt") }
    }

    sourceSets {
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        // Synthetic marker scene (images and ground truth) of the parent
        // repository, read as assets `marker_scene/` by the marker detector test.
        androidTest.assets.srcDirs += '../../../benchmarks/marker_detection/synthetic_scene/bundle'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        compose true
        // The renderer selection experiment is selected at APK build time so
        // matched tablet control/candidate runs can use the same source.
        buildConfig true
    }

    defaultConfig {
        buildConfigField('boolean', 'COVERAGE_CANONICAL_READY_WAKE', coverageCanonicalReadyWake.toString())
        buildConfigField(
            'boolean',
            'COVERAGE_SELECTION_REUSE',
            coverageSelectionReuse.toString(),
        )
        buildConfigField(
            'boolean',
            'COVERAGE_PUBLICATION_DIAGNOSTICS',
            coveragePublicationDiagnostics.toString(),
        )
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'io.github.sceneview:arsceneview:4.47.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // FileProvider of the session log share (was only transitive); the version resolved before.
    implementation 'androidx.core:core:1.18.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    testImplementation 'org.openjdk.jol:jol-core:0.17'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// T5's receipt lock is execution provenance, not a bundled fixture. Forward
// it to the forked unit-test JVM only when a parent runner supplies it.
tasks.withType(Test).configureEach {
    // JOL reads this during its first VM singleton initialization. Per-test setup is too late
    // and makes aggregate results depend on class order.
    systemProperty 'jol.magicFieldOffset', 'true'
    def m0dSourceLock = System.getProperty('m0d.source.lock') ?: System.getenv('M0D_SOURCE_LOCK')
    if (m0dSourceLock != null && !m0dSourceLock.trim().isEmpty()) {
        systemProperty 'm0d.source.lock', m0dSourceLock
    }
}

// The Flutter Gradle plugin injects this dependency when the plugin is built
// through a Flutter application. Keep the standalone JVM project equivalent
// for deterministic native adapter tests without bundling Flutter into the
// plugin artifact itself.
def flutterSdk = providers.gradleProperty('flutter.sdk').orNull ?: System.getenv('FLUTTER_ROOT')
if (flutterSdk == null) {
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        flutterSdk = localProperties.getProperty('flutter.sdk')
    }
}
if (flutterSdk != null) {
    def engineVersion = file("$flutterSdk/bin/cache/engine.stamp").text.trim()
    repositories {
        maven { url = uri('https://storage.googleapis.com/download.flutter.io') }
    }
    dependencies {
        debugCompileOnly "io.flutter:flutter_embedding_debug:1.0.0-$engineVersion"
        testImplementation "io.flutter:flutter_embedding_debug:1.0.0-$engineVersion"
        androidTestImplementation "io.flutter:flutter_embedding_debug:1.0.0-$engineVersion"
        androidTestImplementation "io.flutter:armeabi_v7a_debug:1.0.0-$engineVersion"
        androidTestImplementation "io.flutter:arm64_v8a_debug:1.0.0-$engineVersion"
        androidTestImplementation "io.flutter:x86_debug:1.0.0-$engineVersion"
        androidTestImplementation "io.flutter:x86_64_debug:1.0.0-$engineVersion"
    }
}
